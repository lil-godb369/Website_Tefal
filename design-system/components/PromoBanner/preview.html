<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>PromoBanner</title></head>
<body>
<div id="root" class="tf-root" style="padding:var(--space-8)"></div>
<script>
  var B = window.TF, h = React.createElement;
  function img(id) { return window.TF_IMG ? window.TF_IMG.replace('{id}', id) : undefined; }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'tf-grid-3' },
    h(B.PromoBanner, { kicker: 'Đang giảm giá', title: 'Giảm đến 25% cho đồ bếp Tefal', cta: 'Xem ưu đãi', solid: true, images: [img('NC-067'), img('DK-067')], art: 'set' }),
    h(B.PromoBanner, { kicker: 'Nồi cơm điện', title: '14 mẫu cao tần và điện tử', cta: 'Xem nồi cơm', images: [img('DK-064'), img('DK-090')], art: 'cooker' }),
    h(B.PromoBanner, { kicker: 'Sản xuất tại Pháp', title: '62 mẫu nồi chảo từ nhà máy Pháp', cta: 'Xem nồi chảo', images: [img('NC-059'), img('NC-061')], art: 'pan' })));
</script>
</body>
</html>
