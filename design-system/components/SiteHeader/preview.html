<!-- @dsCard group="Điều hướng" height=340 width=1200 subtitle="Desktop chưa đăng nhập; điện thoại đã đăng nhập" -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>SiteHeader</title>
<style>
  .demo-phone { width: 390px; margin: var(--space-8) 0 var(--space-8) var(--space-12); border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="root" class="tf-root"></div>
<script>
  var B = window.TF, h = React.createElement;
  var strip = [{ icon: 'shield', text: 'Hàng chính hãng Tefal' }, { icon: 'award', text: 'Bảo hành đến 36 tháng' }, { icon: 'store', text: 'Xem và nấu thử tại showroom' }];
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(B.SiteHeader, { active: 'Nồi cơm điện', cartCount: 2, top: strip, contact: { text: 'Liên hệ showroom', href: '#' },
      account: { href: '#', text: 'Đăng nhập / Đăng ký', label: 'Đăng nhập hoặc đăng ký' } }),
    h('div', { className: 'demo-phone' }, h(B.SiteHeader, { compact: true, cartCount: 2, top: strip,
      account: { href: '#', text: 'Chào, Lan', label: 'Tài khoản của Nguyễn Thị Lan', signedIn: true } }))));
</script>
</body>
</html>
