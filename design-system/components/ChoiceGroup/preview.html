<!-- @dsCard group="Nhập liệu" height=330 width=900 subtitle="Lựa chọn dạng thẻ: cách nhận hàng, cách thanh toán" -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>ChoiceGroup</title>
<style>
  .demo-choices { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); max-width: 860px; align-items: start; }
</style>
</head>
<body>
<div id="root" class="tf-root tf-pad"></div>
<script>
  var B = window.TF, h = React.createElement;
  function Demo() {
    var d = React.useState('giao'), delivery = d[0], setDelivery = d[1];
    var y = React.useState('cod'), payment = y[0], setPayment = y[1];
    return h('div', { className: 'demo-choices' },
      h(B.ChoiceGroup, { legend: 'Chọn cách nhận hàng', name: 'demo-giao', value: delivery, onChange: setDelivery, items: [
        { key: 'giao', title: 'Giao tận nơi', text: 'Phí giao báo khi gọi xác nhận đơn.' },
        { key: 'showroom', title: 'Nhận tại showroom', text: 'Xem hàng, nấu thử rồi nhận. Không mất phí giao.' }
      ] }),
      h(B.ChoiceGroup, { legend: 'Chọn cách thanh toán', name: 'demo-tra', value: payment, onChange: setPayment, items: [
        { key: 'cod', icon: 'bag', title: 'Trả tiền mặt khi nhận hàng (COD)', text: 'Kiểm tra hàng rồi mới trả tiền.' },
        { key: 'chuyen-khoan', icon: 'tag', title: 'Chuyển khoản ngân hàng', text: 'Số tài khoản gửi kèm khi gọi xác nhận đơn.' },
        { key: 'online', icon: 'shield', title: 'Thẻ ATM, Visa, ví điện tử', text: 'Chưa mở: cần đăng ký cổng thanh toán.', disabled: true }
      ] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
