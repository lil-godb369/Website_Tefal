<!-- @dsCard group="Điều hướng" height=330 width=1200 subtitle="Ô danh mục: ảnh, vòng biểu tượng, tên in hoa, số mẫu" -->
<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>CategoryTile</title></head>
<body>
<div id="root" class="tf-root" style="padding:var(--space-8)"></div>
<script>
  var B = window.TF, h = React.createElement;
  function img(id) { return window.TF_IMG ? window.TF_IMG.replace('{id}', id) : undefined; }
  var tiles = [
    { name: 'Nồi chảo', count: 104, img: 'NC-060', art: 'set', icon: 'pot' },
    { name: 'Nồi cơm điện', count: 14, img: 'DK-067', art: 'cooker', icon: 'cooker' },
    { name: 'Nồi chiên không dầu', count: 7, img: 'DK-068', art: 'fryer', icon: 'fryer' },
    { name: 'Máy xay & máy ép', count: 23, img: 'DK-050', art: 'blender', icon: 'blender' },
    { name: 'Dao & dụng cụ bếp', count: 25, img: 'DK-052', art: 'knife', icon: 'knife' },
    { name: 'Ấm đun siêu tốc', count: 7, img: 'DK-088', art: 'blender', icon: 'kettle' }
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'tf-grid-6' },
    tiles.map(function (t) { return h(B.CategoryTile, { key: t.name, name: t.name, count: t.count, image: img(t.img), art: t.art, icon: t.icon }); })));
</script>
</body>
</html>
