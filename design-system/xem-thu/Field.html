<!doctype html>
<html lang="vi" data-theme="sang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field — Tefal Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script>var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../components/bundle.js"></script>
<script>window.TF_IMG = 'https://krtjhvqbdjbjibamgslg.supabase.co/storage/v1/object/public/bnb-product-images/manual-thumb/{id}.jpg'; window.TF.photoCrop = { x: 0.02, y: 0.13, w: 0.6, h: 0.8 }; window.TF_HERO = '../assets/Hero/hero-bep.jpg';</script>
<style>
  .demo-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); max-width: 820px; }
</style>
</head>
<body>
<div id="root" class="tf-root tf-pad"></div>
<script>
  var B = window.TF, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'demo-fields' },
    h(B.Field, { id: 'f-ten', label: 'Họ và tên', autoComplete: 'name', value: 'Nguyễn Thị Lan' }),
    h(B.Field, { id: 'f-sdt', label: 'Số điện thoại', type: 'tel', optional: true, value: '', hint: 'Để gọi xác nhận đơn và hẹn giờ giao.' }),
    h(B.Field, { id: 'f-email', label: 'Email', type: 'email', value: 'lan@gmail', error: 'Nhập email đúng dạng, ví dụ ten@gmail.com.' }),
    h(B.PasswordField, { id: 'f-matkhau', label: 'Mật khẩu', value: 'matkhau123', hint: 'Ít nhất 8 ký tự.' }),
    h(B.SelectField, { id: 'f-tinh', label: 'Tỉnh, thành phố', placeholder: 'Chọn tỉnh, thành phố', options: ['Hà Nội', 'TP. Hồ Chí Minh', 'Đà Nẵng'], value: '', error: 'Chọn tỉnh hoặc thành phố.' }),
    h('label', { className: 'tf-check', style: { alignSelf: 'end' } }, h('input', { type: 'checkbox', defaultChecked: true }), 'Lưu địa chỉ này cho lần sau')));
</script>
<script>addEventListener('load',function(){setTimeout(function(){if(parent!==window)parent.postMessage({tfHeight:document.documentElement.scrollHeight},'*');},500);});</script></body>
</html>
