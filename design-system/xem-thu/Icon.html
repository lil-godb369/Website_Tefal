<!doctype html>
<html lang="vi" data-theme="sang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon — Tefal Web</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script>var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../components/bundle.js"></script>
<script>window.TF_IMG = 'https://krtjhvqbdjbjibamgslg.supabase.co/storage/v1/object/public/bnb-product-images/manual-thumb/{id}.jpg'; window.TF.photoCrop = { x: 0.02, y: 0.13, w: 0.6, h: 0.8 }; window.TF_HERO = '../assets/Hero/hero-bep.jpg';</script>
<style>
  .demo-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: var(--space-4) var(--space-2); }
  .demo-icons figure { margin: 0; display: grid; justify-items: center; gap: var(--space-2); color: var(--text); }
  .demo-icons figure:nth-child(-n+4) { color: var(--accent); }
  .demo-icons figcaption { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>
<div id="root" class="tf-root tf-pad"></div>
<script>
  var B = window.TF, h = React.createElement;
  var names = ['shield', 'award', 'tag', 'store', 'search', 'bag', 'menu', 'arrow', 'chevron', 'phone', 'pot', 'cooker', 'fryer', 'blender', 'knife', 'kettle', 'drop', 'home', 'user', 'eye', 'eyeOff', 'logout'];
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'demo-icons' },
    names.map(function (n) { return h('figure', { key: n }, h(B.Icon, { name: n, size: 24 }), h('figcaption', null, n)); })));
</script>
<script>addEventListener('load',function(){setTimeout(function(){if(parent!==window)parent.postMessage({tfHeight:document.documentElement.scrollHeight},'*');},500);});</script></body>
</html>
